[project]
name = "react-isd-baseline"
version = "0.5.0+baseline.1"
description = "English-prompt clone of the benchmark's react-isd agent, extended with token accounting and an adjust (targeted tuning) endpoint for the RQ2 experiment."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/react_isd_baseline"]
