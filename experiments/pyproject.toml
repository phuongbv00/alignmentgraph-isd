[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isd-experiments"
version = "0.1.0"
description = "Thesis experiments driving the ISD agent benchmark: run, score, pool, report."
requires-python = ">=3.11"
# The core install carries no INFERENCE stack -- no torch, no transformers, no
# langchain. That is what moving the alignment protocol out of the benchmark's
# evaluator bought: scoring a finished run, pooling it, and generating every
# table and figure in the paper needs matplotlib alone.
#
# `openai` is here because the primary encoder arm is served over an
# OpenAI-compatible embeddings endpoint, and it is a thin HTTP client rather
# than a model runtime -- a few hundred KB against torch's two gigabytes.
#
# `scipy` computes the inferential statistics (stats.py). 1.15 is the first
# release whose `bootstrap` and `permutation_test` take `rng`; the version a
# pool ran under is recorded in its `config.stats_software`.
#
# LAUNCHING a run is the other half, and it is not declared here. This
# environment is also the one run_benchmark.py executes in, so a machine that
# launches runs additionally carries the benchmark, the seven agents,
# alignmentgraph-isd and isd-evaluator -- ten editable installs off paths in
# this checkout, which no dependency list can name. `isd-exp doctor --fix`
# puts them there and `isd-exp doctor` reports which are missing. A machine
# that only scores and reports never needs them.
dependencies = [
    "matplotlib>=3.8",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "scipy>=1.15",
]

[project.optional-dependencies]
# Local sentence-transformers encoders for the alignment sensitivity arms.
encoder = ["sentence-transformers>=2.5", "torch>=2.2"]
# Fine-tuning and local inference of the 6-way Bloom classifier.
bloom = ["transformers>=4.40", "accelerate>=0.30", "torch>=2.2", "scikit-learn>=1.4"]
# `audit repair` needs isd-evaluator, which is not on any index -- it is one of
# the editable installs `isd-exp doctor --fix` makes. Named here so the
# dependency is declared rather than merely true.
repair = ["isd-evaluator"]
dev = ["pytest>=8", "ruff>=0.4"]
all = ["isd-experiments[encoder,bloom,repair]"]

[project.scripts]
isd-exp = "isd_experiments.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isd_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
