<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1180" height="470" fill="#FFFFFF"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrMini" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C0562D"/>
    </marker>
  </defs>

  <!-- ══════════ Harness boundary ══════════ -->
  <rect x="20" y="44" width="1140" height="410" rx="14"
        fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="9 7"/>
  <text x="40" y="34" font-size="14" font-weight="600" fill="#6B7280">AlignmentGraph-ISD harness&#160;&#160;(agent = harness + model)</text>

  <!-- ══════════ brief input ══════════ -->
  <text x="150" y="90" font-size="12" fill="#374151" text-anchor="middle" font-style="italic">design brief b</text>
  <line x1="150" y1="96" x2="150" y2="120" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ══════════ Specialist pipeline (fixed ADDIE order) ══════════ -->
  <rect x="60" y="122" width="290" height="300" rx="10" fill="#F8FAFC" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="205" y="144" font-size="12.5" font-weight="600" fill="#243B5E" text-anchor="middle">Specialist agents · fixed ADDIE order <tspan font-weight="400" fill="#7189AC" font-size="10.5">§4.2</tspan></text>

  <g font-size="11.5" fill="#374151" text-anchor="middle">
    <rect x="82" y="156" width="196" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="180" y="175">Needs context</text>
    <rect x="82" y="192" width="196" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="180" y="211">Objective design</text>
    <rect x="82" y="228" width="196" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="180" y="247">Assessment design</text>
    <rect x="82" y="264" width="196" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="180" y="283">Activity &amp; material</text>
    <rect x="82" y="300" width="196" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="180" y="319">Implementation plan</text>
    <rect x="82" y="336" width="196" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="180" y="355">Evaluation &amp; revision</text>
    <rect x="82" y="378" width="196" height="30" rx="7" fill="#EEF2F7" stroke="#94A3B8"/>
    <text x="180" y="397" font-style="italic">ADDIE aggregator</text>
  </g>
  <!-- sequential arrows down the pipeline -->
  <g stroke="#4B5563" stroke-width="1.3" marker-end="url(#arr)">
    <line x1="300" y1="186" x2="300" y2="192"/>
    <line x1="300" y1="222" x2="300" y2="228"/>
    <line x1="300" y1="258" x2="300" y2="264"/>
    <line x1="300" y1="294" x2="300" y2="300"/>
    <line x1="300" y1="330" x2="300" y2="336"/>
    <line x1="300" y1="366" x2="300" y2="378"/>
  </g>

  <!-- ══════════ Per-agent verify & repair (self-check tool) ══════════ -->
  <rect x="384" y="150" width="196" height="86" rx="10" fill="#FAEAE3" stroke="#C0562D" stroke-width="1.5"/>
  <circle cx="410" cy="178" r="11" fill="#FFFFFF" stroke="#C0562D" stroke-width="1.5"/>
  <path d="M 404 178 L 408 183 L 416 173" fill="none" stroke="#C0562D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="482" y="176" font-size="12" font-weight="600" fill="#6E2E15" text-anchor="middle">Verify &amp; repair</text>
  <text x="482" y="193" font-size="10" fill="#B07B5E" text-anchor="middle">per-agent tool <tspan font-weight="600">§4.3</tspan></text>
  <text x="482" y="222" font-size="9.5" fill="#8A5A44" text-anchor="middle" xml:space="preserve">repair owned Ω until ∅</text>
  <!-- each specialist self-checks: loop between pipeline and QC -->
  <path d="M 280 200 L 384 178" fill="none" stroke="#C0562D" stroke-width="1.4" marker-end="url(#arrOrange)"/>
  <path d="M 384 210 L 280 250" fill="none" stroke="#C0562D" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrOrange)"/>
  <text x="330" y="176" font-size="9" fill="#C0562D">verify</text>
  <text x="316" y="244" font-size="9" fill="#C0562D">repair</text>

  <!-- ══════════ Alignment graph (center-right) ══════════ -->
  <rect x="628" y="122" width="330" height="300" rx="12" fill="#F0F7F0" stroke="#5B8C5A" stroke-width="2"/>
  <text x="793" y="145" font-size="14" font-weight="600" fill="#2C4A2B" text-anchor="middle">Alignment graph <tspan font-weight="400" fill="#7DA07C" font-size="11">§3.2</tspan></text>
  <text x="793" y="163" font-size="10.5" fill="#6B7280" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">G</tspan><tspan dy="3" font-size="8">t</tspan><tspan dy="-3"> = (V</tspan><tspan dy="3" font-size="8">t</tspan><tspan dy="-3">, E</tspan><tspan dy="3" font-size="8">t</tspan><tspan dy="-3">) · aligned(o)</tspan></text>

  <!-- mini graph edges -->
  <line x1="690" y1="250" x2="772" y2="262" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arrMini)"/>
  <text x="726" y="243" font-size="9.5" font-style="italic" fill="#4A6FA5">measures</text>
  <line x1="687" y1="336" x2="776" y2="276" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arrMini)"/>
  <line x1="692" y1="345" x2="770" y2="345" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arrMini)"/>
  <text x="729" y="366" font-size="9.5" font-style="italic" fill="#4A6FA5">supports</text>
  <line x1="899" y1="295" x2="815" y2="273" stroke="#6B7280" stroke-width="1.2" marker-end="url(#arrMini)"/>
  <text x="866" y="268" font-size="9.5" font-style="italic" fill="#4A6FA5">evaluates</text>

  <!-- mini graph nodes -->
  <circle cx="793" cy="199" r="19" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.3"/>
  <text x="793" y="203" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">NC</text>
  <circle cx="793" cy="265" r="19" fill="#DCEBDC" stroke="#5B8C5A" stroke-width="1.4"/>
  <text x="793" y="269" font-size="10" font-weight="600" fill="#2C4A2B" text-anchor="middle">LO 1</text>
  <circle cx="793" cy="345" r="19" fill="#DCEBDC" stroke="#5B8C5A" stroke-width="1.4"/>
  <text x="793" y="349" font-size="10" font-weight="600" fill="#2C4A2B" text-anchor="middle">LO 2</text>
  <circle cx="671" cy="247" r="19" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.4"/>
  <text x="671" y="251" font-size="10" font-weight="600" fill="#243B5E" text-anchor="middle">AS</text>
  <circle cx="671" cy="345" r="19" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.4"/>
  <text x="671" y="349" font-size="10" font-weight="600" fill="#243B5E" text-anchor="middle">ACT</text>
  <circle cx="917" cy="305" r="19" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.4"/>
  <text x="917" y="309" font-size="10" font-weight="600" fill="#243B5E" text-anchor="middle">EV</text>

  <!-- legend -->
  <circle cx="720" cy="400" r="7" fill="#DCEBDC" stroke="#5B8C5A" stroke-width="1.2"/>
  <text x="733" y="404" font-size="9.5" fill="#4B5563">aligned objective (measures ∧ supports ∧ evaluates)</text>

  <!-- specialists ↔ graph : read/write (bounded scope) -->
  <line x1="580" y1="300" x2="624" y2="300" stroke="#4B5563" stroke-width="1.6"
        marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="602" y="290" font-size="9.5" fill="#4B5563" text-anchor="middle">read / write</text>
  <text x="602" y="316" font-size="8.5" fill="#6B7280" text-anchor="middle">(bounded scope)</text>

  <!-- ══════════ Output ══════════ -->
  <rect x="1000" y="230" width="150" height="86" rx="10" fill="#EEF2F7" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="1075" y="262" font-size="12" font-weight="600" fill="#243B5E" text-anchor="middle">ADDIE program</text>
  <text x="1075" y="284" font-size="10" fill="#7189AC" text-anchor="middle">+ residual</text>
  <text x="1075" y="298" font-size="10" fill="#7189AC" text-anchor="middle">audit §4.4</text>
  <line x1="958" y1="273" x2="996" y2="273" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="977" y="264" font-size="9" fill="#4B5563" text-anchor="middle">emit</text>

</svg>
