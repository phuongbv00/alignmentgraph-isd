# The experiment, declared: the only file to edit to change the ladder, the
# hosts, the experiments or the judges. src/ names no vendor or model family.

# --- Serving: what the endpoints are ------------------------------------------
[serving]
api_spec = "openai_compatible"  # API contract the endpoints speak
key_env = "LLM_API_KEY"         # default key variable for a slot without its own
context_window = 16384          # window the endpoints were launched with

# One table per model; an experiment's `slots` picks and orders them.
#   slot       unique id (env prefix <SLOT>_AGENT_MODEL_*, LaTeX macro word)
#   model      id the endpoint serves; `audit preflight` checks /v1/models
#   display    column header / axis tick, e.g. "0.8B" (required)
#   family     optional display prefix, e.g. "Qwen3.5"
#   base_urls  endpoint(s) of the SAME model; several are round-robined
#   key_env    this model's key variable (default: [serving].key_env)
#   api_spec   optional override of [serving].api_spec
# A hosted slot is a different instrument from a self-hosted one (provider
# picks quantisation and backend): mixing them compares serving stacks too.
[[serving.slots]]
slot = "qwen08b"
model = "Qwen/Qwen3.5-0.8B"
family = "Qwen3.5"
display = "0.8B"
base_urls = ["https://<POD_ID>-8000.proxy.runpod.net/v1"]
key_env = "VLLM_API_KEY"

[[serving.slots]]
slot = "qwen2b"
model = "Qwen/Qwen3.5-2B:featherless-ai"
family = "Qwen3.5"
display = "2B"
base_urls = ["https://router.huggingface.co/v1"]
key_env = "HF_TOKEN"

[[serving.slots]]
slot = "qwen4b"
model = "Qwen/Qwen3.5-4B"
family = "Qwen3.5"
display = "4B"
base_urls = ["https://<POD_ID>-8000.proxy.runpod.net/v1"]
key_env = "VLLM_API_KEY"

[[serving.slots]]
slot = "qwen9b"
model = "Qwen/Qwen3.5-9B"
family = "Qwen3.5"
display = "9B"
base_urls = ["https://<POD_ID>-8000.proxy.runpod.net/v1"]
key_env = "VLLM_API_KEY"

# --- Generation: every call of every agent -----------------------------------
# Applied identically to every agent and every rung (the fairness argument);
# `audit preflight` fails if .env sets any of them. Fixed before `freeze write`.
[generation]
max_output_tokens = 8192        # per-call output ceiling, min(agent's own, this)
streaming = true                # needed behind proxies that cut long reads
temperature = 0.7               # for agents that do not pin their own

# Reasoning tokens allowed before the answer (0 = thinking off). A reply that
# reasons past max_output_tokens returns no content and scores as a failure.
# A router enforces only 0: a positive cap needs every rung self-hosted, which
# every rung above is. Short on purpose: a brief reasoning prefix helps a small
# model's tool calls where a long one hurts them (see docs/guides §3.3).
thinking_budget = 32

# Whether a submit the proposed system's validator refuses is written again by
# the model under that artifact's per-run schema, with the endpoint's decoder
# holding the schema (response_format json_schema). A transport recovery, not
# an ablation axis; the baselines make no such call. Needs a self-hosted
# endpoint whose grammar backend compiles the schema.
structured_outputs = true

# --- The proposed system's run posture ---------------------------------------
[harness]
# Developers of one family run at once (1 = sequential). Wall time only: the
# design is identical whatever the value. Capped by the rate preset's call gate
# (2/3/4/6); fixed before `freeze write`.
fanout_workers = 6

# How much of the planned scale the proposed system's Developers write out.
# The plan always states the course at full scale (item_counts, minutes, media
# selections); the mode decides how much of it is written:
#
#                     "light" (default)                    "full"
#   purpose           a typical, reviewable slice —        deployment: everything
#                     for humans, the LLM judge and        the design plans
#                     the alignment panel
#   assessment items  ~3 per task: ONE per (objective x    every planned item, in
#                     timing) pair, at the objective's     batches that divide the
#                     own Bloom level, in a type that      task's item_counts
#                     can carry it (apply+ -> short_
#                     answer / performance_task)
#   activities        1 per objective at its level, at     the planner's count,
#                     least 3 per module (introduce,       inside the module's
#                     practise, apply)                     minutes
#   materials         2 per module (its typical media),    every media selection,
#                     content = 400-800-char OUTLINE       content complete and
#                                                          learner-ready
#   session guides    1 per module (2 past 180 min),       same
#                     scheduling every id
#   plan, analysis,   identical — full scale, written      identical
#   implementation    once
#
# Uniform across arms and rungs, not an ablation axis; recorded in
# metadata.run_config and the freeze manifest. Fixed before `freeze write`.
development_mode = "light"

# --- Judges ------------------------------------------------------------------
# Score a finished run: `isd-exp judge llm|alignment`, or `run --judge`.

# The benchmark's LLM judge. Only key variable NAMES belong here; a key value
# is refused.
[judge.llm]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"
models = [  # in the order the evaluator reports them
    { name = "openai/gpt-4o-mini" },
    { name = "google/gemini-2.5-flash-lite" },
]

# The alignment panel. Every arm below is scored by default: the primary pair
# plus one arm per single-axis deviation (a star, not a grid). The arm with
# suffix "" writes alignment_scores.json, the file pooling reads; exactly one
# encoder and one classifier may have it.
#   kind       api (served, needs base_urls) | local (sentence-transformers)
#              | tfidf | transformer (Bloom checkpoint) | lexicon
#   macro      LaTeX word form (no digits);  short  label in tables/figures
#   revision   optional HF commit; part of the embedding-cache key
[judge.alignment]
primary_encoder = "nemotron"
primary_bloom = "bertbloom"

[judge.alignment.encoders]
nemotron = { kind = "api",   model = "nvidia/llama-embed-nemotron-8b", suffix = "", macro = "Nemotron", short = "Nemotron", base_urls = ["https://<POD_ID>-8000.proxy.runpod.net/v1"] }
bgem3    = { kind = "local", model = "BAAI/bge-m3", suffix = "bgem3", macro = "BgeMThree", short = "bge-m3" }
granite  = { kind = "local", model = "ibm-granite/granite-embedding-311m-multilingual-r2", suffix = "granite", macro = "Granite", short = "granite" }
tfidf    = { kind = "tfidf", model = "tfidf-char-ngram", suffix = "tfidf", macro = "Tfidf", short = "TF-IDF" }

# A missing checkpoint skips its arm; it never falls back to another.
[judge.alignment.bloom]
bertbloom = { kind = "transformer", checkpoint = "bloom-bert-edm2022", suffix = "", macro = "BertBloom", short = "BERT" }
lexicon   = { kind = "lexicon", suffix = "lexicon", macro = "Lexicon", short = "lexicon" }

# A correction of the primary configuration's family-A cosines, not a new
# instrument: own-scenario minus the same agent's other scenarios in the same
# run (alignment/contrast.py). Reads the primary encoder's embedding cache.
[judge.alignment.baseline]
contrast  = { kind = "own_minus_foreign", suffix = "contrast", macro = "Contrast", short = "own-foreign" }

# --- Experiments -------------------------------------------------------------
# `slots` = "all" or a list of slot ids; `tags` = one run per tag, per slot.

[experiment.tune]
# Calibration only; never enters the paper (own tag namespace, no manifest).
title = "TUNE - cost and budget calibration"
dataset = "train_10"
slots = ["qwen9b"]
tags = ["t1"]
rate_limit = "turbo"
session_prefix = "tune"
confirm = false
agents = ["alignmentgraph-isd", "react-isd"]

[experiment.comparison]
title = "COMPARISON - proposed system vs baselines across model scale"
dataset = "test_90"
slots = "all"
tags = ["c1"]
rate_limit = "turbo"
session_prefix = "comparison"
proposed = "alignmentgraph-isd"
agents = [
    "alignmentgraph-isd",
    "eduplanner",
    "baseline",
    "react-isd",
    "addie-agent",
    "dick-carey-agent",
    "rpisd-agent",
]

[experiment.ablation]
# 2x2 decomposition x substrate. The reference arm runs here too, so every
# delta comes from one run.
title = "ABLATION - decomposition x substrate"
dataset = "test_30"
slots = ["qwen08b", "qwen4b"]          # both ends of the deployment envelope
tags = ["a1"]
rate_limit = "turbo"
session_prefix = "ablation"
reference = "alignmentgraph-isd"
arms = [  # reference first
    { id = "alignmentgraph-isd",              agent_mode = "multi",  context_mode = "graph" },
    { id = "alignmentgraph-isd-multi-prose",  agent_mode = "multi",  context_mode = "prose" },
    { id = "alignmentgraph-isd-single-graph", agent_mode = "single", context_mode = "graph" },
    { id = "alignmentgraph-isd-single-prose", agent_mode = "single", context_mode = "prose" },
]
