# The experiment, declared.
#
# This file is the ONLY thing to edit to run a different model ladder, serve
# from a different host, or change what the two experiments compare. Nothing in
# src/ names a vendor or a model family; tests/test_no_vendor_names.py enforces
# that.

[serving]
# The API contract the endpoints speak. shared/llm/factory.py dispatches on it.
api_spec = "openai_compatible"
# Name of the env var holding the key every rung authenticates with.
key_env = "LLM_API_KEY"

# --- serving limits: uniform across every agent and every rung ---------------
# Applying them uniformly is the fairness argument the comparison rests on, so
# they sit here and never on a rung: a per-rung window would make the ladder a
# comparison of budgets rather than of model scale. The launcher hands them to
# the benchmark as a command prefix, so a stale .env line cannot take them back,
# and `audit preflight` fails if .env sets any of them at all.
#
# The window the endpoints were launched with, in tokens.
context_window = 16384
# Ceiling on every agent's per-call output budget. The benchmark's model factory
# applies it centrally as min(the agent's own budget, this), and the proposed
# system reserves exactly this much for the answer when it sizes its transcript.
max_output_tokens = 8192
# Client-side streaming with stream_usage. Required behind a proxy that closes a
# long non-streaming read before the largest rung finishes a turn.
streaming = true
# How many tokens a reply may spend REASONING before it must start answering.
# 0 serves with thinking off; a positive number caps it.
#
# A cap rather than an off switch: reasoning shares one completion budget with
# the answer, so a reply that reasons past max_output_tokens never closes its
# thinking block, the reasoning parser classifies the whole output as thinking,
# and the call is charged in full and returns NO CONTENT -- which the harness
# then records as the model failing to act. That is infrastructure noise
# flowing into a scored quantity, so this is a measurement-validity setting and
# not a speed setting.
#
# The number is fixed on the tune slice BEFORE `isd-exp freeze write` and is
# not revised after results are seen, like the trajectory cap policy.
#
# A POSITIVE NUMBER IS ONLY MEANINGFUL IF EVERY RUNG IS SERVED RATHER THAN
# ROUTED. A self-hosted endpoint enforces the ceiling; an aggregating router
# picks an upstream provider per request, and measured, one honoured the
# ceiling while another ignored it -- so a ladder mixing the two would enforce
# it on some rungs and not others, which is bias along the independent variable
# itself. What a router DOES enforce reliably is 0. So: self-host every rung
# and declare a number, or declare 0. Nothing here can check this for you --
# whether an endpoint is served or routed is not a property this file records,
# and src/ may not name a vendor -- so it is the operator's to confirm before
# freezing. Two of the [[model]] tables below are routed today.
thinking_budget = 512

# --- The models -------------------------------------------------------------
# A FLAT list. One table per model, in no particular order: nothing here is a
# position in a sequence, and nothing assumes one family or one host.
#
# What makes a LADDER is which slots an experiment picks and in what order --
# `[experiment.*].slots` below. So a second family, the same size twice on
# different hosts, or a model shared by three experiments all declare the same
# way here, and a new ladder is a new `slots` list rather than a new section.
#   slot      IDENTITY, unique, and the env-quad prefix
#             -> <SLOT>_AGENT_MODEL_{BASE_URLS,NAME,API_KEY_ENVS}
#   family    display prefix for THIS model on axes, headers and captions.
#             Per model: one global prefix was the one-family assumption.
#   model     what the server serves; passed to --agent-model-name, and what
#             `audit preflight` expects the endpoint's /v1/models to report
#   display   REQUIRED: the column header and axis tick for this model, e.g.
#             "0.8B". Stated, never derived: it used to come from a parameter
#             count, and a label derived from a number cannot tell two models
#             of the same size apart. The LaTeX macro word comes from `slot`
#             (qwen08b -> QwenZeroEightB), which is unique by construction.
#   base_urls where the model is served. One URL, or a list of them when several
#             servers hold the SAME model -- the agents round-robin across the
#             list. Set them by hand after the servers are up; this file is the
#             only place an endpoint is written, and `audit preflight`
#             checks exactly these URLs before a run.
#   key_env   the env var holding THIS model's bearer token. Omit it and the
#             model falls back to [serving].key_env -- but on a declaration
#             that spans hosts, naming it here is what keeps one provider's
#             credential from being handed to another provider's endpoint.
#   api_spec  optional: the API contract THIS endpoint speaks. Omit and it
#             uses [serving].api_spec.
#
# Nothing has to live on one host. A model here is a URL, a model id and a key
# name, so a ladder mixing your own GPUs with a hosted API needs no new
# concept -- only a per-model key_env naming that provider's credential:
#
#   [[model]]
#   slot = "qwen9b"
#   model = "qwen/qwen3.5-9b"              # the id THAT host serves it under
#   display = "9B"
#   base_urls = ["https://openrouter.ai/api/v1"]
#   key_env = "OPENROUTER_API_KEY"
#
# Worth saying out loud, because the declaration will not say it for you: a
# hosted model is not the same instrument as a self-hosted one. The provider
# chooses the quantisation, the backend and the sampling defaults, and may
# route one id to several of them -- so a `slots` list mixing the two compares
# model scale AND serving stack at once. `freeze write` records what you
# declared, not what the provider did with it.
[[model]]
slot = "qwen08b"
model = "Qwen/Qwen3.5-0.8B"
family = "Qwen3.5"
display = "0.8B"
base_urls = ["https://<POD_ID>-8000.proxy.runpod.net/v1"]
key_env = "VLLM_API_KEY"

[[model]]
slot = "qwen2b"
model = "Qwen/Qwen3.5-2B:featherless-ai"
family = "Qwen3.5"
display = "2B"
base_urls = ["https://router.huggingface.co/v1"]
key_env = "HF_TOKEN"

[[model]]
slot = "qwen4b"
model = "Qwen/Qwen3.5-4B"
family = "Qwen3.5"
display = "4B"
base_urls = ["https://<POD_ID>-8000.proxy.runpod.net/v1"]
key_env = "VLLM_API_KEY"

[[model]]
slot = "qwen9b"
model = "qwen/qwen3.5-9b:nitro"
family = "Qwen3.5"
display = "9B"
base_urls = ["https://openrouter.ai/api/v1"]
key_env = "OPENROUTER_API_KEY"

# --- The LLM judge ----------------------------------------------------------
# The roster decides what every reported LLM judge score means, so it is
# declared here, where `isd-exp freeze write` fingerprints it, rather than left
# to a .env a tuning session can leave behind. The launcher passes it to the
# benchmark as --judge-model-* flags, and `isd-exp audit repair` names the same
# roster, so a re-judged row is scored by the judges that scored the run.
#
# Only the NAME of a key variable appears here. A key value is not expressible
# in this file -- the parser refuses one.
[judge]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"

# One table per judge, in the order the evaluator reports them. The roadmap
# scores each cell with ONE judge; a second is the corroboration subset, and
# adding it back changes what every reported LLM judge score is a score FROM,
# so it is a decision rather than a knob.
[[judge.models]]
name = "openai/gpt-4o-mini"

# [[judge.models]]
# name = "google/gemini-2.5-flash-lite"

# --- The two official experiments -------------------------------------------

[experiment.comparison]
# The proposed system against the benchmark's own agents, across model scale.
# `slots` is what makes this experiment's ladder: "all" takes every declared
# model in declaration order, or name them to carve a specific one.
title = "COMPARISON - proposed system vs baselines across model scale"
dataset = "test_90"
slots = "all"
tags = ["c1"]
rate_limit = "turbo"
session_prefix = "comparison"
proposed = "alignmentgraph-isd"
agents = [
    "alignmentgraph-isd",
    "eduplanner",
    "baseline",
    "react-isd",
    "addie-agent",
    "dick-carey-agent",
    "rpisd-agent",
]

[experiment.ablation]
# 2x2: decomposition (agent_mode) x substrate (context_mode). The reference arm
# is re-run here rather than borrowed from the comparison experiment -- judge
# session, scenario set and size range all differ, so a delta is only clean
# when both sides come from the same run.
title = "ABLATION - decomposition x substrate"
dataset = "test_30"
slots = ["qwen08b", "qwen4b"]          # both ends of the deployment envelope
tags = ["a1"]
rate_limit = "turbo"
session_prefix = "ablation"
reference = "alignmentgraph-isd"

# Reference arm first: every delta is taken against it, and leading with it
# makes that visible in the banner and the manifest.
[[experiment.ablation.arms]]
id = "alignmentgraph-isd"
agent_mode = "multi"
context_mode = "graph"
[[experiment.ablation.arms]]
id = "alignmentgraph-isd-multi-prose"
agent_mode = "multi"
context_mode = "prose"
[[experiment.ablation.arms]]
id = "alignmentgraph-isd-single-graph"
agent_mode = "single"
context_mode = "graph"
[[experiment.ablation.arms]]
id = "alignmentgraph-isd-single-prose"
agent_mode = "single"
context_mode = "prose"

[experiment.tune]
# Not an official experiment: cost estimation and budget calibration only.
# Its results never enter the paper, which is why it has its own tag namespace.
title = "TUNE - cost and budget calibration"
dataset = "train_10"
slots = ["qwen9b"]
tags = ["t1"]
rate_limit = "turbo"
session_prefix = "tune"
confirm = false
agents = ["alignmentgraph-isd", "react-isd"]

# --- The alignment measurement ----------------------------------------------
# Two instrument families, each with its own sensitivity axis. The sweep is a
# STAR, not a grid: every arm deviates from the primary on exactly one axis.
#
#   kind = "api"    served over an OpenAI-compatible embeddings endpoint
#          "local"  sentence-transformers in-process (downloads once)
#          "tfidf"  pure Python, no download, bit-wise deterministic
# The arm whose suffix is "" owns alignment_scores.json -- the artifact pooling
# reads -- so exactly one encoder and one classifier may have an empty suffix.

[alignment]
primary_encoder = "nemotron"
primary_bloom = "bertbloom"

[alignment.encoders.nemotron]
# LaTeX macro names cannot contain digits, so each arm needs a word form.
macro = "Nemotron"
short = "Nemotron"
kind = "api"
model = "nvidia/llama-embed-nemotron-8b"
suffix = ""
# The one arm that needs a server (`vllm serve <model> --task embed`); the
# others run in-process on this machine. Same shape as a rung's: several URLs
# load-balance ONE embedding space, so every one of them must serve this model.
# `key_env` is available here too, for an endpoint on a different host.
base_urls = []
# HF commit pinning the weights. It also enters the embedding-cache key, so a
# bump re-embeds rather than serving the old vectors under the new label.
# revision = "<commit>"

[alignment.encoders.bgem3]
# LaTeX macro names cannot contain digits, so each arm needs a word form.
macro = "BgeMThree"
short = "bge-m3"
kind = "local"
model = "BAAI/bge-m3"
suffix = "bgem3"

[alignment.encoders.granite]
# LaTeX macro names cannot contain digits, so each arm needs a word form.
macro = "Granite"
short = "granite"
kind = "local"
model = "ibm-granite/granite-embedding-311m-multilingual-r2"
suffix = "granite"

[alignment.encoders.tfidf]
# LaTeX macro names cannot contain digits, so each arm needs a word form.
macro = "Tfidf"
short = "TF-IDF"
kind = "tfidf"
model = "tfidf-char-ngram"
suffix = "tfidf"

# Family B. The primary is a 6-way BERT head fine-tuned on the EDM2022CLO
# corpus; the lexicon arm is derived from the taxonomy rather than from
# labelled data, which is what makes it a real independence check rather than
# a mirror. A missing checkpoint SKIPS its arm -- it never falls back silently,
# because a silent fallback changes the primary instrument without saying so.
[alignment.bloom.bertbloom]
# LaTeX macro names cannot contain digits, so each arm needs a word form.
macro = "BertBloom"
short = "BERT"
kind = "transformer"
checkpoint = "bloom-bert-edm2022"
suffix = ""

[alignment.bloom.lexicon]
# LaTeX macro names cannot contain digits, so each arm needs a word form.
macro = "Lexicon"
short = "lexicon"
kind = "lexicon"
suffix = "lexicon"
