<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Master Thesis Proposal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  #slide {
    width: 92vw;
    height: 88vh;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    padding: 52px 64px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: relative;
  }

  /* ── accent bar at top ── */
  #slide::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #4f46e5, #06b6d4, #10b981);
    border-radius: 16px 16px 0 0;
  }

  /* ── slide header ── */
  .s-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6366f1;
    margin-bottom: 10px;
  }

  .s-title {
    font-size: 2rem;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.2;
    margin-bottom: 28px;
  }

  .s-title .accent { color: #4f46e5; }

  /* ── body text ── */
  .s-body { display: flex; flex-direction: column; gap: 16px; flex: 1; }

  p { font-size: 1.05rem; line-height: 1.75; color: #334155; }

  strong { color: #0f172a; font-weight: 700; }

  em { color: #6366f1; font-style: normal; font-weight: 600; }

  code {
    background: #ede9fe;
    color: #4f46e5;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }

  /* ── cards / pill-list ── */
  .card-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .card {
    flex: 1 1 180px;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card .card-icon { font-size: 1.4rem; }
  .card .card-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #94a3b8; }
  .card .card-text { font-size: 0.95rem; color: #1e293b; line-height: 1.5; }

  .card.blue  { border-color: #bfdbfe; background: #eff6ff; }
  .card.indigo{ border-color: #c7d2fe; background: #eef2ff; }
  .card.teal  { border-color: #99f6e4; background: #f0fdfa; }
  .card.violet{ border-color: #ddd6fe; background: #f5f3ff; }
  .card.rose  { border-color: #fecdd3; background: #fff1f2; }
  .card.amber { border-color: #fde68a; background: #fffbeb; }

  /* ── pill list ── */
  .pill-list { display: flex; flex-direction: column; gap: 10px; }

  .pill {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: #f8fafc;
    border-radius: 10px;
    padding: 12px 16px;
    border-left: 4px solid #e2e8f0;
    font-size: 1rem;
    color: #334155;
    line-height: 1.6;
  }

  .pill.ind  { border-color: #6366f1; }
  .pill.teal { border-color: #14b8a6; }
  .pill.blue { border-color: #3b82f6; }
  .pill.rose { border-color: #f43f5e; }
  .pill.amber{ border-color: #f59e0b; }
  .pill.green{ border-color: #22c55e; }
  .pill.violet{border-color: #8b5cf6; }

  .pill-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 8px;
    flex-shrink: 0;
  }
  .ind   .pill-dot { background: #6366f1; }
  .teal  .pill-dot { background: #14b8a6; }
  .blue  .pill-dot { background: #3b82f6; }
  .rose  .pill-dot { background: #f43f5e; }
  .amber .pill-dot { background: #f59e0b; }
  .green .pill-dot { background: #22c55e; }
  .violet .pill-dot{ background: #8b5cf6; }

  /* ── formula block ── */
  .formula {
    background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
    border-radius: 14px;
    padding: 20px 32px;
    text-align: center;
    color: #fff;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 1px;
  }

  /* ── section label badge ── */
  .badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .badge-indigo { background: #eef2ff; color: #4f46e5; }
  .badge-teal   { background: #f0fdfa; color: #0d9488; }
  .badge-rose   { background: #fff1f2; color: #e11d48; }
  .badge-amber  { background: #fffbeb; color: #d97706; }
  .badge-blue   { background: #eff6ff; color: #2563eb; }

  /* ── divider ── */
  .divider { border: none; border-top: 1.5px solid #e2e8f0; margin: 8px 0; }

  /* ── two-col layout ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  .harness-layout {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .harness-copy {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .harness-copy p { font-size: 0.95rem; line-height: 1.5; }

  .harness-copy .formula {
    padding: 14px 24px;
    font-size: 1.25rem;
  }

  .harness-figure {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
    align-items: center;
    gap: 18px;
    min-width: 0;
  }

  .harness-figure img {
    width: 100%;
    max-height: 280px;
    object-fit: contain;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    background: #f8fafc;
    box-shadow: 0 14px 30px rgba(15,23,42,0.08);
  }

  .harness-examples {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .harness-example {
    border-radius: 10px;
    border: 1.5px solid #e2e8f0;
    background: #f8fafc;
    padding: 8px 12px;
    min-width: 0;
  }

  .harness-example strong {
    display: block;
    color: #475569;
    font-size: 0.68rem;
    letter-spacing: 0.8px;
    line-height: 1.25;
    text-transform: uppercase;
  }

  .harness-example span {
    display: block;
    color: #1e293b;
    font-size: 0.76rem;
    line-height: 1.25;
    margin-top: 3px;
  }

  @media (max-width: 900px) {
    .harness-figure { grid-template-columns: 1fr; }
    .harness-figure img { max-height: 240px; }
  }

  /* ── TOC special ── */
  .toc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
  }

  .toc-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px 16px;
  }

  .toc-num {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.9rem;
    flex-shrink: 0;
    color: #fff;
  }

  .toc-text { font-size: 0.95rem; color: #1e293b; font-weight: 500; }

  .n1 { background: #4f46e5; }
  .n2 { background: #06b6d4; }
  .n3 { background: #10b981; }
  .n4 { background: #f59e0b; }
  .n5 { background: #f43f5e; }
  .n6 { background: #8b5cf6; }
  .n7 { background: #64748b; }
  .n8 { background: #0ea5e9; }

  /* ── nav bar ── */
  #nav {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  #nav button {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid #e2e8f0;
    background: #fff;
    color: #334155;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }

  #nav button:hover:not(:disabled) {
    background: #eef2ff;
    border-color: #6366f1;
    color: #4f46e5;
  }

  #nav button:disabled {
    opacity: 0.3;
    cursor: default;
  }

  #counter {
    font-size: 0.78rem;
    color: #94a3b8;
    letter-spacing: 1px;
    font-weight: 600;
    min-width: 48px;
    text-align: center;
  }

  /* scrollbar */
  #slide::-webkit-scrollbar { width: 4px; }
  #slide::-webkit-scrollbar-track { background: transparent; }
  #slide::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body>
<div id="slide"></div>
<div id="nav">
  <button id="btn-prev" onclick="go(-1)">&#8592;</button>
  <div id="counter"></div>
  <button id="btn-next" onclick="go(1)">&#8594;</button>
</div>

<script>
const slides = [
  /* ── 0 — Title ── */
  {content: `
    <div class="s-label">Master Thesis · 2026</div>

    <p style="font-size:1.15rem;color:#64748b;margin:-18px 0 18px;font-style:italic">Harness thực thi cho ISD agents · Đào tạo nội bộ phần mềm · ADDIE-compatible · ISD-Agent-Bench</p>
    <div class="toc-grid">
      <div class="toc-item"><div class="toc-num n1">1</div><div class="toc-text">Problem Statement</div></div>

      <div class="toc-item"><div class="toc-num n4">4</div><div class="toc-text">Research Questions</div></div>

  /* ── 1 — Problem 1/2 ── */
  {content: `

    <div class="s-body">
      <div class="pill-list">
        <div class="pill rose"><div class="pill-dot"></div><div>Khoá học đào tạo nhân viên, fresher hoặc kỹ sư chuyển vai trò phải được cập nhật liên tục: theo thay đổi công nghệ, yêu cầu dự án, năng lực đầu vào và phản hồi sau mỗi batch.</div></div>

  {content: `

        <div class="pill violet"><div class="pill-dot"></div><div>Các ISD agents hiện có trong ISD-Agent-Bench đại diện cho từng chiến lược đơn lẻ. Luận văn đặt vấn đề ở <strong>tầng harness</strong>: làm thế nào xây dựng môi trường thực thi điều phối được workflow, kiểm tra được chất lượng và đánh giá được bằng benchmark.</div></div>
      </div>
    </div>

  /* ── 3 — Harness Concept ── */
  {content: `
    <div class="s-label">2 · Harness Concept</div>
    <div class="s-title">ISD Agent = <span class="accent">Harness</span> + Model</div>
    <div class="s-body harness-layout">
      <div class="harness-copy">
        <p>Harness cung cấp <strong>môi trường thực thi chuyên cho ISD</strong>; model cung cấp năng lực ngôn ngữ, reasoning và generation bên trong môi trường đó.</p>
        <p>Harness không gắn cứng với một mô hình ISD duy nhất. ADDIE chỉ là <strong>output contract</strong> để tương thích với ISD-Agent-Bench; các chiến lược backward design, constructive alignment, Gagne sequencing được dùng như policy/verifier bên trong.</p>
        <div class="formula">ISD Agent = ISD Agent Harness + Model</div>

const params = new URLSearchParams(location.search);
let current = Math.min(Math.max((parseInt(params.get('slide')) || 1) - 1, 0), slides.length - 1);

function render() {
  document.getElementById('slide').innerHTML = slides[current].content;
  document.getElementById('counter').textContent = `${current + 1} / ${slides.length}`;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === slides.length - 1;
  history.replaceState(null, '', `?slide=${current + 1}`);
}

function go(dir) {
  const next = current + dir;
  if (next >= 0 && next < slides.length) { current = next; render(); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft')  go(-1);
});

render();
</script>
