[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alignmentgraph-isd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.1",
    "langgraph>=0.2",
    "pydantic>=2",
    "jsonschema>=4",
    "json-repair>=0.25",
]

[project.optional-dependencies]
# Provider clients for the standalone CLI / app paths (llm_factory_from_env).
# Not needed for the benchmark, which injects its own llm_factory.
llm = [
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
]
# Demo web app (alignmentgraph_isd.server + the built webapp/dist SPA).
# NOT needed for the benchmark: the benchmark installs this package plain, and
# `import alignmentgraph_isd` must never pull FastAPI in. See
# tests/test_import_isolation.py, which is the guard for that rule.
server = [
    "alignmentgraph-isd[llm]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2",
    "python-multipart>=0.0.9",
]

[project.scripts]
alignmentgraph-isd = "alignmentgraph_isd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alignmentgraph_isd"]
# webapp/ is a Vite project, not a Python package (no __init__.py). Only its
# built output is shippable; the sources and node_modules never belong in a wheel.
exclude = [
    "src/alignmentgraph_isd/webapp/node_modules",
    "src/alignmentgraph_isd/webapp/src",
    "src/alignmentgraph_isd/webapp/*.json",
    "src/alignmentgraph_isd/webapp/*.ts",
    "src/alignmentgraph_isd/webapp/*.html",
]
