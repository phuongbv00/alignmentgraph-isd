[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alignmentgraph-isd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.1",
    "langgraph>=0.2",
    "pydantic>=2",
    "jsonschema>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alignmentgraph_isd"]
