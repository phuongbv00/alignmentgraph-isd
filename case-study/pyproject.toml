[project]
name = "isd-case-study"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alignmentgraph-isd",
    "react-isd-baseline",
]

[dependency-groups]
# pytest is needed at runtime by run_case_study.py --fake-llm, which imports
# alignmentgraph-isd/tests/conftest.py for its canned FakeChatModel.
dev = ["pytest>=7"]

[tool.uv.sources]
alignmentgraph-isd = { path = "../alignmentgraph-isd", editable = true }
react-isd-baseline = { path = "baselines/react-isd", editable = true }
